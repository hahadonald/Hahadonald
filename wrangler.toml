name = "hahadonald-site"
type = "javascript"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

# D1 production database
[[d1_databases]]
binding = "DB"
database_name = "hahadonald-db"
database_id = "8bb05c0d-2ed7-40c9-8413-b798ce4a3f26"

